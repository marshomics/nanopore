# Nanopore assembly + annotation pipeline — config
# All paths are absolute on the cluster filesystem.

# ---------- Software paths ----------
dorado_binary: /ebio/abt3_scratch/jmarsh/software/dorado-1.3.1-linux-x64/bin/dorado
basecall_model: /ebio/abt3_projects2/Gut_nanopore/data/models/dna_r10.4.1_e8.2_400bps_sup@v5.2.0
mod_models:
  - /ebio/abt3_projects2/Gut_nanopore/data/models/dna_r10.4.1_e8.2_400bps_sup@v5.2.0_4mC_5mC@v1
  - /ebio/abt3_projects2/Gut_nanopore/data/models/dna_r10.4.1_e8.2_400bps_sup@v5.2.0_6mA@v1
kit_name: SQK-RBK114-24

# Barcode classification happens during basecalling (s01) using kit_name, and
# both demux stages normally just trust the BC tags it wrote (--no-classify).
#
# Set demux_reclassify: true to make the demux stages RE-SCAN the already-
# basecalled reads for barcodes instead. This lets you change the barcode kit
# without paying for a full re-basecall — signal->sequence conversion doesn't
# depend on the kit, only the barcode assignment does. CPU-only, minutes not
# GPU-hours.
#
# Remember to delete fastq_raw/, bams/ and everything downstream first, or the
# resume guards will skip the demux stages entirely.
demux_reclassify: false
demux_kit_name: ""        # defaults to kit_name above when left empty

# ---------- CUDA (used during basecall + demux) ----------
cuda_dir: /ebio/abt3_projects/software
cuda_version: cuda-11.7

# ---------- Conda envs ----------
# The env names here must match envs that exist on the cluster.
# `nanopore` is expected to have dorado, chopper.
# `autocycler` is expected to have autocycler + every assembler in `assemblers`.
# `prokka` is expected to have prokka.
conda_env_basecall: nanopore
conda_env_demux: nanopore
conda_env_chopper: nanopore
conda_env_autocycler: autocycler
# Bakta is installed in the env called 'prokka' on this cluster.
conda_env_bakta: prokka
conda_env_gtdbtk: gtdbtk3
# mmseqs env carries minimap2, samtools, flye, metabat2 (with
# jgi_summarize_bam_contig_depths), and the python/matplotlib/pandas stack
# used by the report generator. Only CheckM2 lives in its own env.
conda_env_mapping: mmseqs         # minimap2 + samtools
conda_env_flye_meta: nanopore     # flye --meta
conda_env_metabat: mmseqs         # metabat2 + jgi_summarize_bam_contig_depths
conda_env_checkm2: checkm2
conda_env_report: mmseqs          # python + matplotlib + pandas for the HTML report
# MIJAMP env needs: pandas, meme, ont-modkit, minimap2, samtools, biopython, xmltodict
conda_env_mijamp: mijamp

# ---------- Chopper QC ----------
chopper_quality: 10
chopper_min_length: 500

# ---------- Autocycler ----------
assemblers:
  - canu
  - flye
  - metamdbg
  - miniasm
  - necat
  - nextdenovo
  - plassembler
  - raven
threads_per_assembler: 16
threads_necat: 4               # necat hard-caps lower than the others
jobs_per_assembly_batch: 4     # how many helper commands per SGE job

# Drop contigs below this length (bp) from each assembly before compress.
# Set to 0 to disable. Fragmented assemblies (miniasm/raven on noisy reads)
# routinely blow past compress's contigs-per-input threshold without this.
min_contig_length: 1000

# autocycler compress --max_contigs threshold. Only emitted when != 25
# (the autocycler default) so older versions without the flag still work.
max_contigs: 25

# ---------- Annotation (Bakta for Bacteria, Prokka for Archaea) ----------
# Both tools live in conda_env_bakta. GTDB-Tk's domain call selects the tool
# and its species call selects the --proteins reference.
bakta_db: /ebio/abt3_scratch/jmarsh/bakta/db/db
bakta_min_contig_length: 200
bakta_threads: 20

# Local, offline collection of RefSeq type-strain proteomes used for
# --proteins. Build it on an INTERNET-CONNECTED machine with:
#
#   python3 build_type_strain_db.py \
#       --from-gtdbtk <run>/gtdbtk/output/gtdbtk.bac120.summary.tsv \
#       --from-gtdbtk <run>/gtdbtk/output/gtdbtk.ar53.summary.tsv \
#       --out-dir ./type_strain_db
#
# then rsync ./type_strain_db to the cluster and point this at it. The
# directory must contain index.tsv and proteomes/*.faa.
#
# Leave empty to auto-discover (see below). If nothing is found the pipeline
# annotates without --proteins, logs a WARN, and writes missing_species.txt
# listing what it wanted.
type_strain_db_dir: ""

# When type_strain_db_dir is empty — or points somewhere without a usable
# index.tsv — these locations are searched ON THE CLUSTER at runtime and the
# first valid one is adopted automatically. <output-dir>/type_strain_db is
# always tried first, before this list. $VARS and ~ are expanded.
type_strain_db_search_paths:
  - /ebio/abt3_scratch/$USER/type_strain_db
  - /ebio/abt3_projects2/Gut_nanopore/data/type_strain_db
  - ~/type_strain_db

# ---------- GTDB-Tk ----------
# Uses Bakta's per-sample *.fna outputs as input. A batchfile of paths is
# generated automatically at runtime. The conda env must have a working
# GTDBTK_DATA_PATH set (or supply gtdbtk_data_path below to export it).
gtdbtk_cpus: 20
gtdbtk_pplacer_cpus: 12
gtdbtk_extension: fna           # Bakta's annotated assembly fasta extension
gtdbtk_data_path: ""            # leave empty to use the conda env's GTDBTK_DATA_PATH

# ---------- Mapping / meta-assembly / binning / CheckM2 ----------
minimap2_threads: 20
flye_meta_threads: 20
flye_meta_min_unmapped_reads: 100   # skip meta-assembly if unmapped read count is below this
metabat_min_contig: 1500            # MetaBAT2 default; raise to 2500 for stricter binning
checkm2_threads: 20
checkm2_db: /ebio/abt3_scratch/jmarsh/checkm2/db/CheckM2_database/uniref100.KO.1.dmnd
# CheckM2 uses python multiprocessing, whose shutdown finaliser rmtree's its
# temp dir. On NFS that hits the "silly rename" problem and throws
#   OSError: [Errno 16] Device or resource busy: .../pymp-XXXX
# after the results have already been written — harmless, but noisy, and it
# leaves stale pymp-* directories behind. Point TMPDIR at node-local disk.
# Empty means /tmp/checkm2.<pid> on the execution node.
checkm2_tmpdir: ""

# ---------- MIJAMP ----------
# Path to a git-cloned MIJAMP repo. Empty value disables the s21_mijamp stage.
# Install once with:
#   git clone https://code.ornl.gov/alexander-public/mijamp.git /path/to/mijamp
mijamp_dir: ""
mijamp_threads: 20

# ---------- SGE ----------
email: james.marsh@tuebingen.mpg.de
sge_pe_parallel: 20
sge_h_rt_gpu: "200:0:0"
sge_h_rt_cpu: "200:0:0"
sge_h_rt_assembly: "400:0:0"
sge_h_vmem_gpu: "80G"
sge_h_vmem_cpu: "20G"
sge_h_vmem_gtdbtk: "100G"     # GTDB-Tk database is memory-hungry
# dorado demux --sort-bam holds records in memory while sorting; a full
# PromethION run (30M+ reads) will OOM at 20G. Bump if s02b_demux_bam dies
# silently partway through (SGE hard-kills leave no message in the log).
sge_h_vmem_demux_bam: "100G"
# minimap2 index + samtools sort (default ~768M per thread x 20 threads)
# will not fit in 20G for multi-million-read samples.
sge_h_vmem_mapping: "100G"
sge_gpumem: "20G"
