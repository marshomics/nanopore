# Nanopore assembly + annotation pipeline — config
# All paths are absolute on the cluster filesystem.

# ---------- Software paths ----------
dorado_binary: /ebio/abt3_scratch/jmarsh/software/dorado-1.3.1-linux-x64/bin/dorado
basecall_model: /ebio/abt3_projects2/Gut_nanopore/data/models/dna_r10.4.1_e8.2_400bps_sup@v5.2.0
mod_models:
  - /ebio/abt3_projects2/Gut_nanopore/data/models/dna_r10.4.1_e8.2_400bps_sup@v5.2.0_4mC_5mC@v1
  - /ebio/abt3_projects2/Gut_nanopore/data/models/dna_r10.4.1_e8.2_400bps_sup@v5.2.0_6mA@v1
kit_name: SQK-RBK114-24

# ---------- CUDA (used during basecall + demux) ----------
cuda_dir: /ebio/abt3_projects/software
cuda_version: cuda-11.7

# ---------- Conda envs ----------
# The env names here must match envs that exist on the cluster.
# `nanopore` is expected to have dorado, chopper.
# `autocycler` is expected to have autocycler + every assembler in `assemblers`.
# `prokka` is expected to have prokka.
conda_env_basecall: nanopore
conda_env_demux: nanopore
conda_env_chopper: nanopore
conda_env_autocycler: autocycler
# Bakta is installed in the env called 'prokka' on this cluster.
conda_env_bakta: prokka
conda_env_gtdbtk: gtdbtk3

# ---------- Chopper QC ----------
chopper_quality: 10
chopper_min_length: 500

# ---------- Autocycler ----------
assemblers:
  - canu
  - flye
  - metamdbg
  - miniasm
  - necat
  - nextdenovo
  - plassembler
  - raven
threads_per_assembler: 16
threads_necat: 4               # necat hard-caps lower than the others
jobs_per_assembly_batch: 4     # how many helper commands per SGE job

# Drop contigs below this length (bp) from each assembly before compress.
# Set to 0 to disable. Fragmented assemblies (miniasm/raven on noisy reads)
# routinely blow past compress's contigs-per-input threshold without this.
min_contig_length: 1000

# autocycler compress --max_contigs threshold. Only emitted when != 25
# (the autocycler default) so older versions without the flag still work.
max_contigs: 25

# ---------- Bakta ----------
bakta_db: /ebio/abt3_scratch/jmarsh/bakta/db/db
bakta_min_contig_length: 200
bakta_threads: 20

# ---------- GTDB-Tk ----------
# Uses Bakta's per-sample *.fna outputs as input. A batchfile of paths is
# generated automatically at runtime. The conda env must have a working
# GTDBTK_DATA_PATH set (or supply gtdbtk_data_path below to export it).
gtdbtk_cpus: 20
gtdbtk_pplacer_cpus: 12
gtdbtk_extension: fna           # Bakta's annotated assembly fasta extension
gtdbtk_data_path: ""            # leave empty to use the conda env's GTDBTK_DATA_PATH

# ---------- SGE ----------
email: james.marsh@tuebingen.mpg.de
sge_pe_parallel: 20
sge_h_rt_gpu: "200:0:0"
sge_h_rt_cpu: "200:0:0"
sge_h_rt_assembly: "400:0:0"
sge_h_vmem_gpu: "80G"
sge_h_vmem_cpu: "20G"
sge_h_vmem_gtdbtk: "100G"     # GTDB-Tk database is memory-hungry
sge_gpumem: "20G"
